# https://taskfile.dev
version: '3'

vars:
  BINARY: kubeconfig-composer
  PKG: github.com/naymi/kubeconfig-composer

tasks:
  default:
    desc: Показать список доступных задач
    cmds:
      - task --list
    silent: true

  setup:
    desc: Подготовить свежий checkout к работе (зависимости, git hook); безопасно запускать повторно
    cmds:
      - task: setup:deps
      - task: setup:hooks

  setup:deps:
    desc: Проверить версию Go и скачать зависимости модуля
    cmds:
      - go version
      - go mod download

  setup:hooks:
    desc: Установить pre-commit hook, который запускает task check
    cmds:
      - |
        hook="$(git rev-parse --git-path hooks/pre-commit)"
        marker="# managed by: task setup"
        if [ -e "$hook" ] && ! grep -qF "$marker" "$hook"; then
          echo "pre-commit hook уже существует и создан не через task setup, пропускаю: $hook"
          exit 0
        fi
        mkdir -p "$(dirname "$hook")"
        printf '#!/bin/sh\n%s\nexec task check\n' "$marker" > "$hook"
        chmod +x "$hook"
        echo "pre-commit hook установлен: $hook"

  build:
    desc: Собрать бинарник
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'

  run:
    desc: 'Запустить без сборки: task run -- <команда> [флаги]'
    cmds:
      - go run . {{.CLI_ARGS}}

  install:
    desc: Установить бинарник в GOPATH/bin
    cmds:
      - go install .

  test:
    desc: Прогнать все тесты
    cmds:
      - go test ./...

  test:verbose:
    desc: Прогнать все тесты с подробным выводом
    cmds:
      - go test ./... -v

  test:pkg:
    desc: 'Тесты одного пакета: task test:pkg -- ./pkg/composer'
    cmds:
      - go test {{.CLI_ARGS}} -v

  test:install:
    desc: Тесты install.sh на локальном HTTP-сервере вместо GitHub (нужен python3)
    cmds:
      - sh scripts/install_test.sh

  cover:
    desc: Тесты с отчётом о покрытии (coverage.out + HTML)
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -func=coverage.out

  vet:
    desc: Статический анализ go vet
    cmds:
      - go vet ./...

  lint:sh:
    desc: shellcheck для install.sh и скриптов (пропускается, если shellcheck не установлен)
    cmds:
      - |
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "shellcheck не установлен, пропускаю (brew install shellcheck)"
          exit 0
        fi
        shellcheck install.sh scripts/*.sh

  fmt:
    desc: Отформатировать код
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Проверить форматирование (падает, если есть неотформатированные файлы)
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  tidy:
    desc: Привести в порядок go.mod/go.sum
    cmds:
      - go mod tidy

  check:
    desc: Полная проверка перед коммитом (fmt-check, vet, test, lint:sh, test:install)
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: lint:sh
      - task: test:install

  clean:
    desc: Удалить артефакты сборки
    cmds:
      - rm -f {{.BINARY}} coverage.out
