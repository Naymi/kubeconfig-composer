# https://taskfile.dev
version: '3'

vars:
  BINARY: kubeconfig-composer
  PKG: github.com/naymi/kubeconfig-composer
  GO_IMAGE: golang:1.24.1-bookworm
  TEST_IMAGE: kubeconfig-composer-test:local

tasks:
  default:
    desc: Показать список доступных задач
    cmds:
      - task --list
    silent: true

  setup:
    desc: Подготовить свежий checkout к работе (зависимости, git hook); безопасно запускать повторно
    cmds:
      - task: setup:deps
      - task: setup:hooks
      - task: setup:docker

  setup:deps:
    desc: Проверить версию Go и скачать зависимости модуля
    cmds:
      - go version
      - go mod download

  setup:hooks:
    desc: Установить pre-commit hook, который запускает task check
    cmds:
      - |
        hook="$(git rev-parse --git-path hooks/pre-commit)"
        marker="# managed by: task setup"
        if [ -e "$hook" ] && ! grep -qF "$marker" "$hook"; then
          echo "pre-commit hook уже существует и создан не через task setup, пропускаю: $hook"
          exit 0
        fi
        mkdir -p "$(dirname "$hook")"
        printf '#!/bin/sh\n%s\nexec task check\n' "$marker" > "$hook"
        chmod +x "$hook"
        echo "pre-commit hook установлен: $hook"

  setup:docker:
    desc: Скачать образ для контейнерных тестов (пропускается без Docker, без запущенного daemon или без сети)
    cmds:
      - |
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker не установлен, пропускаю (нужен для task test:docker и task test:container)"
          exit 0
        fi
        if ! docker info >/dev/null 2>&1; then
          echo "docker daemon недоступен, пропускаю (нужен для task test:docker и task test:container)"
          exit 0
        fi
        docker pull {{.GO_IMAGE}} || echo "не удалось скачать {{.GO_IMAGE}}; task test:docker скачает его при первом запуске"

  build:
    desc: Собрать бинарник
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'

  run:
    desc: 'Запустить без сборки: task run -- <команда> [флаги]'
    cmds:
      - go run . {{.CLI_ARGS}}

  install:
    desc: Установить бинарник в GOPATH/bin
    cmds:
      - go install .

  test:
    desc: Прогнать все тесты
    cmds:
      - go test ./...

  test:verbose:
    desc: Прогнать все тесты с подробным выводом
    cmds:
      - go test ./... -v

  test:pkg:
    desc: 'Тесты одного пакета: task test:pkg -- ./pkg/composer'
    cmds:
      - go test {{.CLI_ARGS}} -v

  test:install:
    desc: Тесты install.sh на локальном HTTP-сервере вместо GitHub (нужен python3)
    cmds:
      - sh scripts/install_test.sh

  test:docker:
    desc: 'go test в контейнере, исходники read-only, на хост ничего не пишется: task test:docker -- ./pkg/initstate/... -run Name -v'
    cmds:
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}":/src:ro
        -v kubeconfig-composer-gomod:/go/pkg/mod
        -w /src
        -e GOCACHE=/tmp/gocache
        -e GOFLAGS=-buildvcs=false
        {{.GO_IMAGE}} go test {{.CLI_ARGS}}

  test:container:
    desc: Полный прогон в контейнере - gofmt, vet (linux и windows), unit-тесты, затем e2e init в bash и zsh
    cmds:
      - docker build --progress=plain -f scripts/Dockerfile.test --build-arg GO_IMAGE={{.GO_IMAGE}} -t {{.TEST_IMAGE}} .
      - docker run --rm {{.TEST_IMAGE}}

  cover:
    desc: Тесты с отчётом о покрытии (coverage.out + HTML)
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -func=coverage.out

  vet:
    desc: Статический анализ go vet
    cmds:
      - go vet ./...

  lint:sh:
    desc: shellcheck для install.sh и скриптов (пропускается, если shellcheck не установлен)
    cmds:
      - |
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "shellcheck не установлен, пропускаю (brew install shellcheck)"
          exit 0
        fi
        shellcheck install.sh scripts/*.sh

  fmt:
    desc: Отформатировать код
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Проверить форматирование (падает, если есть неотформатированные файлы)
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  tidy:
    desc: Привести в порядок go.mod/go.sum
    cmds:
      - go mod tidy

  check:
    desc: Полная проверка перед коммитом (fmt-check, vet, test, lint:sh, test:install)
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: lint:sh
      - task: test:install

  clean:
    desc: Удалить артефакты сборки
    cmds:
      - rm -f {{.BINARY}} coverage.out
